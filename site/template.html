<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DHW Inf 服务器模组目录及其支持的最近游戏版本">
  <title>DHW Inf 模组目录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="head">
      <h1>DHW Inf 模组目录</h1>
      <p class="head__stamp">更新于 <time>{{UPDATED_AT}}</time></p>
    </header>

    <div class="catalogue">
      <section class="readiness" aria-labelledby="readiness-title">
        <h2 id="readiness-title" class="visually-hidden">最新正式版及其模组兼容比例</h2>
        <p class="readiness__total"><span class="readiness__num">{{MOD_COUNT}}</span> 个模组</p>
        <ul class="readiness__list">
{{READINESS}}
        </ul>
      </section>

      <section class="mods" aria-labelledby="mod-list-title">
        <h2 id="mod-list-title" class="visually-hidden">模组及其支持的正式版本</h2>
        <ul class="mod-list">
{{MOD_ROWS}}
        </ul>
      </section>
    </div>
  </main>
</body>
</html>
